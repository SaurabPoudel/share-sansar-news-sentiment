name: Daily NEPSE Sentiment Analysis

on:
  schedule:
    # Run at 10:15 AM UTC (4:00 PM NPT) Sun-Thu after NEPSE close
    # NEPSE market hours: Sun-Thu, 11:00 AM - 3:00 PM NPT
    # NPT = UTC+5:45, so 4:00 PM NPT = 10:15 AM UTC
    - cron: '15 10 * * 0-4'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run sentiment analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m nepse_sentiment.main

      - name: Validate output schema
        run: uv run python -m nepse_sentiment.validate

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/api/history
          cp -r api/* _site/api/ 2>/dev/null || true
          # Add CORS headers via _headers file
          cat > _site/_headers <<'EOF'
          /api/*
            Access-Control-Allow-Origin: *
            Content-Type: application/json; charset=utf-8
            Cache-Control: public, max-age=300
          EOF
          # Create index.html redirect
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0;url=api/sentiment.json"></head>
          <body><p>Redirecting to <a href="api/sentiment.json">sentiment.json</a></p></body>
          </html>
          EOF
          # Copy summary if exists
          cp api/latest-summary.md _site/api/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
