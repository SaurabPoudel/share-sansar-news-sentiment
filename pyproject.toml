[project]
name = "nepse-sentiment"
version = "1.0.0"
description = "Automated NEPSE market sentiment analysis pipeline"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0,<3",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0.0,<6",
    "pydantic>=2.5.0,<3",
    "pyyaml>=6.0,<7",
    "google-generativeai>=0.8.0,<1",
    "tenacity>=8.2.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.0.0,<6",
]

[project.scripts]
nepse-sentiment = "nepse_sentiment.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nepse_sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
